services:
  mongo:
    image: mongo:7
    container_name: reclamos_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - reclamos_net

  neo4j:
    image: neo4j:5-community
    container_name: reclamos_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j-init:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - reclamos_net

  # Contenedor de un solo uso: espera a que Neo4j este healthy y carga el
  # grafo de ejemplo (neo4j-init/init.cypher). Equivalente para Neo4j de lo
  # que docker-entrypoint-initdb.d hace automaticamente para Mongo. Todas las
  # sentencias son MERGE, por lo que reintentarlo o correrlo de nuevo no
  # duplica datos.
  neo4j_seed:
    image: neo4j:5-community
    container_name: reclamos_neo4j_seed
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j-init:/import:ro
    entrypoint: ["cypher-shell", "-a", "bolt://neo4j:7687", "-u", "neo4j", "-p", "password123", "-f", "/import/init.cypher"]
    restart: "no"
    networks:
      - reclamos_net

  api:
    build: ./api
    container_name: reclamos_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: marketplace_claims
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
    volumes:
      - ./api/app:/app/app
    networks:
      - reclamos_net

volumes:
  mongo_data:
  neo4j_data:
  neo4j_logs:

networks:
  reclamos_net:
    driver: bridge
